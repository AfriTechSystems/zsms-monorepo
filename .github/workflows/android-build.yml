# Build an installable Android APK of the ZSMS mobile app.
#
# ## Why here rather than EAS
#
# This needs no Expo account, no build queue and no Android Studio on anybody's laptop.
# GitHub's Ubuntu runners already ship the Android SDK and a JDK, which is the whole of
# what a React Native build wants. The APK comes out as a workflow artifact.
#
# ## Why a development build at all
#
# Expo Go cannot run this app's native modules. Push notifications were removed from it
# in SDK 53, so the account screen's notification control can never work there whatever
# we fix. A development build is our own binary containing our exact native modules,
# with the same fast-refresh experience — installed once, and only rebuilt when a native
# package is added or upgraded.
#
# ## Run it by hand
#
# Actions → "Android development build" → Run workflow. It is deliberately not on push:
# a ten-minute build on every commit would be waste, and the APK only needs rebuilding
# when the native side changes.

name: Android development build

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which phone architecture'
        type: choice
        default: both
        options:
          # Two separate APKs, each about half the size. A phone only needs one.
          - both
          # Almost every phone sold since about 2018.
          - arm64-v8a
          # Older and budget handsets, still ordinary in Zambia.
          - armeabi-v7a
      variant:
        description: 'Which build to produce'
        type: choice
        default: development
        options:
          # Connects to a Metro server you run with `npx expo start --dev-client`.
          # This is the one for day-to-day testing.
          - development
          # Self-contained: the JavaScript is bundled in. Slower to build, nothing to
          # run alongside it — for handing to somebody who is not a developer.
          - standalone

# Only one build at a time; a second run supersedes the first rather than queueing
# behind it, because an APK from a commit you have moved past is of no use.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # Gradle on a cold cache is slow, and failing at 60 minutes tells you nothing the
    # log does not already say.
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make room on the runner
        # Building two ABIs ran the runner out of disk — "No space left on device"
        # during Gradle. An Ubuntu runner ships with ~14 GB free and tens of gigabytes
        # of toolchains this build never touches. Removing them is the standard fix and
        # takes under a minute.
        #
        # The Android SDK and NDK are deliberately NOT removed: React Native needs both.
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules                       /opt/ghc /usr/local/.ghcup                       /usr/local/share/boost /usr/share/swift                       /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # React Native 0.86's Gradle plugin needs 17. The runner has several; this
          # pins the one Gradle will use rather than inheriting whatever is default.
          java-version: '17'
          distribution: temurin

      - name: Install dependencies
        # `npm ci` so the lockfile decides, and the native-module versions the overrides
        # pin are exactly the ones that get built. An `npm install` here could resolve
        # differently from the laptop that tested the change.
        run: npm ci

      - name: Write the app's environment
        # These are inlined into the bundle at build time, so they have to exist before
        # prebuild runs. A Clerk PUBLISHABLE key is public by design — it ships in every
        # client — but it lives in a repository secret anyway so it is set in one place.
        working-directory: apps/mobile
        run: |
          {
            echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
            echo "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}"
          } > .env
          echo "Wrote .env with ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && 'a Clerk key' || 'NO Clerk key — sign-in will fail' }}"

      - name: Give the build a fresh version
        # Android refuses to replace an installed app when the incoming versionCode is
        # lower, and several OEM installers (common on budget handsets) also refuse an
        # EQUAL one — reported as a bare "App not installed" with no reason. Every
        # build was versionCode 1, so the second APK could never replace the first.
        #
        # The run number is monotonic per workflow, which is exactly the property
        # versionCode needs.
        working-directory: apps/mobile
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '
');
            console.log('versionCode', a.expo.android.versionCode);
          "

      - name: Generate the native project
        # `android/` is not in the repository: it is generated from app.json, so what
        # ships always matches the configuration rather than a committed copy somebody
        # forgot to regenerate. `--clean` because a cached one would defeat that.
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Sign with v1 as well as v2
        # `assembleDebug` signs v2-only once minSdk is 24+. Android 7+ accepts that,
        # but several OEM package installers still want the v1 (JAR) signature for a
        # sideloaded APK and reject it otherwise — again as a bare "App not installed".
        #
        # Edited after prebuild because `android/` is generated and not in the
        # repository; doing it here keeps app.json the single source of configuration.
        working-directory: apps/mobile/android
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('app/build.gradle')
          s = p.read_text()
          # The debug signingConfig always exists in the React Native template.
          s = re.sub(
              r"(signingConfigs\s*\{\s*debug\s*\{)",
              r"
            enableV1Signing true
            enableV2Signing true",
              s, count=1)
          p.write_text(s)
          print('v1 signing enabled' if 'enableV1Signing' in s else 'WARNING: could not patch')
          PY

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        working-directory: apps/mobile/android
        # One APK PER ARCHITECTURE, not one carrying both.
        #
        # A combined debug build measured 131 MB, and roughly 100 MB of that was
        # unstripped native libraries — half of which the phone downloading it can
        # never execute. Building each separately halves the download and costs only a
        # second Gradle pass over an already-warm cache.
        #
        # x86 and x86_64 stay omitted: those are emulators, and an emulator can reach
        # Metro directly without an APK at all.
        run: |
          chmod +x ./gradlew
          TASK=assembleDebug
          if [ "${{ inputs.variant }}" = "standalone" ]; then
            # Release, but signed with the debug key — installable for testing without
            # a keystore. Not for the Play Store; that needs a real signing key.
            TASK=assembleRelease
          fi

          case "${{ inputs.abi }}" in
            both) ABIS="arm64-v8a armeabi-v7a" ;;
            *)    ABIS="${{ inputs.abi }}" ;;
          esac

          mkdir -p "$GITHUB_WORKSPACE/out"
          for ABI in $ABIS; do
            echo "::group::Building $ABI"
            ./gradlew "$TASK" -PreactNativeArchitectures="$ABI"
            APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
            if [ -z "$APK" ]; then
              echo "No APK for $ABI — the Gradle output above will say why."
              exit 1
            fi
            cp "$APK" "$GITHUB_WORKSPACE/out/zsms-$ABI.apk"
            echo "::endgroup::"
            echo "$ABI -> $(du -h "$APK" | cut -f1)"
          done
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: zsms-${{ inputs.variant }}-${{ github.sha }}
          # One file per architecture. Install the one matching the phone — arm64-v8a
          # for almost anything sold since about 2018, armeabi-v7a otherwise.
          path: out/*.apk
          # Long enough to keep testing against, short enough not to accumulate.
          retention-days: 14
          if-no-files-found: error
