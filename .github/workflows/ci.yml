# CI for the ZSMS monorepo.
#
# `THIRTEEN_LAYER_COMPLIANCE.md` has listed Layer 7 as **Thin** since the repository
# was created, with the note "no CI exists, so no test blocks a merge". This is that
# gap closed.
#
# ## Two jobs, split by whether they need Docker
#
# `checks` is fast and needs nothing but Node, so it fails in about two minutes on the
# common mistakes. `database` starts a real Postgres and is the slower, more valuable
# half — see below.
#
# ## The database job tests something never tested before
#
# Every one of the 82 migrations had only ever been applied INCREMENTALLY to
# `zsms-dev`. Nobody had ever run the full sequence against an empty database. A
# migration that depends on something a later migration creates, or on data that only
# exists on dev, would have gone unnoticed indefinitely — `supabase db reset` here is
# the first time that is checked, on every push.
#
# **It earned its cost on the first complete run**, finding three defects nothing on a
# developer machine could: a NOT NULL column added in `0114` that broke every existing
# writer of `announcements` INCLUDING a live API route, and two DELETE grants that
# violated invariants two older suites already asserted. See `0129`.
#
# ## What this deliberately does NOT do
#
# It does not touch `zsms-dev`, staging or production. No Supabase access token is
# used and none is needed: the database job runs an entirely local Postgres in the
# runner. Prohibition 10 — a migration reaching production requires explicit human
# approval — is untouched by anything here.

name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

# A second push to the same branch makes the first run's answer irrelevant. Cancel it
# rather than paying for both and reading the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `.nvmrc` is the single source of the Node version, so CI and a developer
          # machine cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      # `ci` not `install`: it installs exactly the lockfile and fails if
      # package.json and the lock have diverged, which is itself worth catching.
      - run: npm ci

      # Cheapest checks first, so an obvious mistake fails in seconds rather than
      # after a four-minute build.
      - name: Migration sequence
        run: npm run db:check:migrations

      - name: pgTAP plan counts
        # Every `plan(N)` must match the real assertion count in its file. pg_prove
        # fails a mismatch, and this catches it without needing a database — it has
        # already caught two in development.
        run: npm run db:test:plans

      # Pure-logic tests, needing no database. Webhook signature verification is the
      # first of them: nothing in SQL can test it, and a verifier that accepts anything
      # looks identical to one that works until somebody posts a forged payload.
      - name: Unit tests
        run: npm run test:unit

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not need real credentials. These are syntactically valid
          # placeholders: a Next build evaluates module-level code, so a missing
          # variable can fail the build even where no request is made. If a real
          # secret is ever genuinely required to BUILD, that is a design problem to
          # fix rather than a secret to add here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          # Must be a DECODABLE key: Clerk parses the base64 domain out of it and
          # throws on a malformed one while compiling the middleware. A literal
          # "placeholder" passes locally only because .env.local holds a real key.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder

  database:
    name: Migrations and RLS suites
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Docker Hub rate-limits unauthenticated pulls per IP, and a GitHub runner shares that IP
      # with every other unauthenticated runner. It cost two red builds on 2026-09-30 —
      # "toomanyrequests: Rate exceeded", then "Data limit exceeded" on the re-run — and in both
      # cases the suites never ran at all, which reads as a code failure and is not one.
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start local Supabase
        # The CLI is a devDependency (never a global), so CI and a developer machine
        # run the same version. Only the database is needed — skipping the rest saves
        # several minutes of image pulls per run.
        # **Only Postgres.** This job applies migrations and runs pgTAP; it never
        # touches Studio, the API gateway, auth, storage, realtime or the log
        # pipeline. Starting them pulled THIRTEEN images per run and was the direct
        # cause of four red builds on 2026-10-11 — "toomanyrequests: Rate exceeded"
        # from Docker Hub, with the credentials correctly configured and the login
        # step passing. The authenticated allowance was simply spent on images this
        # job does not use.
        #
        # An earlier comment here said exclusions were avoided because "the service
        # names are version-specific and one wrong name fails `start` outright", and
        # suggested checking `supabase start --help` for the pinned version. That was
        # the right instinct and the list below is the result of doing it: these are
        # the names the pinned CLI (2.114.x) prints itself, not names guessed from
        # another version's documentation.
        #
        # If a future CLI renames one, `start` fails loudly on the name rather than
        # quietly skipping a service — which is the failure mode worth having.
        #
        # Retried three times with a growing wait, because Docker Hub's limit is a
        # WINDOW and not a wall: a pull refused now often succeeds a minute later. On
        # 2026-10-11 three consecutive runs went red on "toomanyrequests: Rate
        # exceeded" with the credentials correctly configured and the login step
        # passing — the authenticated allowance had simply been spent by that day's
        # earlier runs.
        #
        # The cost of not retrying is worse than slow: a red build that is not about
        # the code trains everybody to ignore red builds, and the next real failure
        # arrives looking exactly like this one.
        run: |
          for attempt in 1 2 3; do
            if npx supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt (commonly a Docker Hub rate limit). Retrying."
            npx supabase stop --no-backup || true
            sleep $((attempt * 60))
          done
          echo "::error::supabase start failed three times. If the log says 'toomanyrequests', this is Docker Hub's pull limit and not a code failure — see CREDENTIALS_CHECKLIST.md."
          exit 1

      - name: Apply every migration to an empty database
        # `db reset` drops and replays 0001 → 0129 in order.
        # A migration that silently depended on dev's existing data, or on another
        # migration applied out of order, fails here and only here.
        run: npx supabase db reset

      - name: Show migration status
        # So a failed reset is diagnosable from the log rather than needing a rerun.
        if: always()
        run: npx supabase migration list --local || true

      - name: RLS and behaviour suites
        # 21 pgTAP suites, 508 assertions. These are the tests that actually prove
        # tenant isolation, the fee controls, grading-scale versioning and the network
        # boundary — the things a type checker cannot see.
        run: npx supabase test db

      - name: Stop Supabase
        # `always()` so a failed suite still tears down; a leaked container would make
        # the next run on a self-hosted runner fail for an unrelated reason.
        if: always()
        run: npx supabase stop --no-backup
